# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "CEE"
version = "0.1.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "accountability",
  "semantic-interoperability",
  "contextual-evidence",
  "provenance",
  "formal-specification",
  "formal-verification",
  "proof-carrying",
  "theorem-proving",
  "lean4"
]

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["CEE"]

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "CEE"

# ============================================================
# EXECUTABLES
# ============================================================
# Export executables generate machine-readable contract artifacts.

[[lean_exe]]
name = "verify"
root = "Main"

# ============================================================
# External dependencies
# ============================================================

# REQ.DEPENDENCY.ACCOUNTABLE_ENTITIES:
#   Accountable Entities (AE) layer.
#   MUST remain logically upstream of Evolution Protocol (EP).
[[require]]
name = "AccountableEntities"
git = "https://github.com/structural-explainability/AccountableEntities.git"
rev = "main"

# REQ.DEPENDENCY.ACCOUNTABLE_ENTITIES:
#   Evolution Protocol (EP) layer.
#   MUST remain logically upstream.
[[require]]
name = "EvolutionProtocol"
git = "https://github.com/structural-explainability/EvolutionProtocol.git"
rev = "main"
